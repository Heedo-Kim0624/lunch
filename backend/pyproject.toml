[project]
name = "lunch-api"
version = "0.1.0"
description = "Explainable personalized lunch recommendation API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Django>=5.2,<5.3",
  "djangorestframework>=3.16,<4",
  "django-cors-headers>=4.7,<5",
  "dj-database-url>=3.0,<4",
  "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-django>=4.11,<5",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "lunch_api.settings"
pythonpath = ["."]
testpaths = ["accounts/tests", "recommendations/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["recommendations/migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
